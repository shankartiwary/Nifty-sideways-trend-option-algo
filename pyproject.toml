[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-sideways-trend-option-algo"
version = "0.1.0"
description = "Option algo for sideways/trend detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit",
    "smartapi-python>=1.0",
    "pyotp>=2.9.0",
    "numpy",
    "pandas",
    "pyyaml",
    "pytz"
]

[tool.setuptools]
# (optional) include non-Python files via MANIFEST.in if you need

[tool.setuptools.packages.find]
where = ["."]
include = ["brokers*", "strategy*"]
exclude = ["tests*", "docs*"]
